version: "3.8"

# 1. Define shared resources used across containers
volumes:
  postgres_data: # Persistent storage disk for the database

networks:
  app_network: # Isolated virtual network for inter-container communication
    driver: bridge

# 2. Define the three running services
services:

  # --- DATABASE SERVICE ---
  db:
    image: postgres:15-alpine # Uses official off-the-shelf image directly
    container_name: pdf_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Mounts internal database directory to persistent Docker volume
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    # Port mapping is optional here; only needed if you want to inspect 
    # the database from host tools (like DBeaver or PgAdmin) outside Docker.
    ports:
      - "5432:5432"

  # --- BACKEND SERVICE ---
  backend:
    build:
      context: ./backend # Path to backend folder containing Dockerfile
      dockerfile: Dockerfile
    container_name: pdf_backend
    restart: always
    environment:
      # Notice 'db' matches the service name of the database container above
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_API_KEY: ${LLM_API_KEY}
    volumes:
      # Optional volume if you need to store raw uploaded PDFs on disk
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8003" # Exposes FastAPI port to host machine
    networks:
      - app_network
    depends_on:
      - db # Ensures DB container starts before backend attempts startup

  # --- FRONTEND SERVICE ---
  frontend:
    build:
      context: ./frontend # Path to frontend folder containing Dockerfile
      dockerfile: Dockerfile
    container_name: pdf_frontend
    restart: always
    environment:
      # Streamlit calls the backend using the internal service name 'backend'
      BACKEND_API_URL: ${BACKEND_API_URL}
    ports:
      - "8501:8501" # Exposes Streamlit UI port to host browser
    networks:
      - app_network
    depends_on:
      - backend # Ensures FastAPI is ready before UI launches